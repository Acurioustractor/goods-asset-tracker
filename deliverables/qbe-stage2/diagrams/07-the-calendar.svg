<text x="70" y="62" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">SOURCED DATES: JAY BOOLKIN 24 AUG; MIRANDA CAMPBELL 1 SEP; KATIE NORMAN 31 AUG; ADAM'S INVITE 28 AUG</text>
<text x="70" y="108" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="38" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">The calendar: three applications inside fourteen days</text>
<line x1="70" y1="126" x2="150" y2="126" stroke="#C45C3E" stroke-width="3"/>
<text x="70" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">One strategy, three cuts. QBE and Brian M. Davis close on the same Friday; Tim Fairfax two weeks later. All three want the same program described the same way.</text>
<line x1="110" y1="470" x2="1490" y2="470" stroke="#2B2A26" stroke-width="2"/><line x1="110" y1="462" x2="110" y2="478" stroke="#2B2A26" stroke-width="2"/><text x="118" y="500" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="1.5">SEPTEMBER</text><line x1="570" y1="462" x2="570" y2="478" stroke="#2B2A26" stroke-width="2"/><text x="578" y="500" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="1.5">OCTOBER</text><line x1="1045.3333333333335" y1="462" x2="1045.3333333333335" y2="478" stroke="#2B2A26" stroke-width="2"/><text x="1053.3333333333335" y="500" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="1.5">NOVEMBER</text><circle cx="140.66666666666666" cy="470" r="6" fill="#2B2A26"/><line x1="140.66666666666666" y1="470" x2="140.66666666666666" y2="442" stroke="#CFC7B8" stroke-width="1.5"/><rect x="70" y="338" width="240" height="104" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.2"/><text x="82" y="362" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Thu 3 Sep</text><text x="82" y="384" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Final cohort check-in with Social</text><text x="82" y="400.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Impact Hub, 2pm Sydney. Ben with</text><text x="82" y="416.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Eloise on Butterfly's books.</text><circle cx="232.66666666666669" cy="470" r="6" fill="#2B2A26"/><line x1="232.66666666666669" y1="470" x2="232.66666666666669" y2="500" stroke="#CFC7B8" stroke-width="1.5"/><rect x="112.66666666666669" y="500" width="240" height="104" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.2"/><text x="124.66666666666669" y="524" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">7 to 11 Sep</text><text x="124.66666666666669" y="546" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Philanthropy Australia conference,</text><text x="124.66666666666669" y="562.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Brisbane. Miranda from Brian M.</text><text x="124.66666666666669" y="578.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Davis sees a bed.</text><circle cx="309.3333333333333" cy="470" r="6" fill="#2B2A26"/><line x1="309.3333333333333" y1="470" x2="309.3333333333333" y2="322" stroke="#CFC7B8" stroke-width="1.5"/><rect x="189.33333333333331" y="218" width="240" height="104" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.2"/><text x="201.33333333333331" y="242" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Mon 14 Sep</text><text x="201.33333333333331" y="264" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Butterfly Movement AGM, tentative.</text><text x="201.33333333333331" y="280.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Directors resign and are</text><text x="201.33333333333331" y="296.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">reappointed.</text><circle cx="478" cy="470" r="9" fill="#C45C3E"/><line x1="478" y1="470" x2="478" y2="620" stroke="#CFC7B8" stroke-width="1.5"/><rect x="358" y="620" width="240" height="104" rx="6" fill="#EDE5D8" stroke="#C45C3E" stroke-width="2"/><text x="370" y="644" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="14" fill="#C45C3E" font-weight="600" text-anchor="start" letter-spacing="0">Fri 25 Sep, 12pm</text><text x="370" y="666" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">QBE Stage 2 form closes. Brian M.</text><text x="370" y="682.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Davis application closes the same</text><text x="370" y="698.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">day.</text><circle cx="662" cy="470" r="6" fill="#2B2A26"/><line x1="662" y1="470" x2="662" y2="442" stroke="#CFC7B8" stroke-width="1.5"/><rect x="542" y="338" width="240" height="104" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.2"/><text x="554" y="362" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Wed 7 Oct</text><text x="554" y="384" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">QBE application review meeting,</text><text x="554" y="400.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">9:45 Sydney, booked.</text><circle cx="692.6666666666666" cy="470" r="6" fill="#2B2A26"/><line x1="692.6666666666666" y1="470" x2="692.6666666666666" y2="500" stroke="#CFC7B8" stroke-width="1.5"/><rect x="572.6666666666666" y="500" width="240" height="104" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.2"/><text x="584.6666666666666" y="524" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Fri 9 Oct, 5pm</text><text x="584.6666666666666" y="546" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Tim Fairfax Family Foundation</text><text x="584.6666666666666" y="562.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">application closes.</text><circle cx="907.3333333333333" cy="470" r="6" fill="#2B2A26"/><line x1="907.3333333333333" y1="470" x2="907.3333333333333" y2="442" stroke="#CFC7B8" stroke-width="1.5"/><rect x="787.3333333333333" y="338" width="240" height="104" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.2"/><text x="799.3333333333333" y="362" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Fri 23 Oct</text><text x="799.3333333333333" y="384" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">QBE conditional outcomes.</text><circle cx="1229.3333333333333" cy="470" r="9" fill="#C45C3E"/><line x1="1229.3333333333333" y1="470" x2="1229.3333333333333" y2="620" stroke="#CFC7B8" stroke-width="1.5"/><rect x="1109.3333333333333" y="620" width="240" height="104" rx="6" fill="#EDE5D8" stroke="#C45C3E" stroke-width="2"/><text x="1121.3333333333333" y="644" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="14" fill="#C45C3E" font-weight="600" text-anchor="start" letter-spacing="0">Fri 13 Nov</text><text x="1121.3333333333333" y="666" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">QBE deadline to meet any</text><text x="1121.3333333333333" y="682.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">pre-conditions.</text><circle cx="1321.3333333333333" cy="470" r="6" fill="#2B2A26"/><line x1="1321.3333333333333" y1="470" x2="1321.3333333333333" y2="442" stroke="#CFC7B8" stroke-width="1.5"/><rect x="1201.3333333333333" y="338" width="240" height="104" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.2"/><text x="1213.3333333333333" y="362" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Thu 19 Nov</text><text x="1213.3333333333333" y="384" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Brian M. Davis board decides.</text><circle cx="1428.6666666666667" cy="470" r="6" fill="#2B2A26"/><line x1="1428.6666666666667" y1="470" x2="1428.6666666666667" y2="322" stroke="#CFC7B8" stroke-width="1.5"/><rect x="1290" y="218" width="240" height="104" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.2"/><text x="1302" y="242" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Late Nov</text><text x="1302" y="264" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Tim Fairfax board decides (date</text><text x="1302" y="280.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">unconfirmed).</text>
<line x1="70" y1="838" x2="1530" y2="838" stroke="#CFC7B8" stroke-width="1"/>
<text x="70" y="862" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">The timing fault to raise with Social Impact Hub: both foundation boards decide after QBE's 13 November pre-condition date. Question two for Jay is whether written invitations with callable contacts count as</text><text x="70" y="879.55" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">conditional commitments, and whether the pre-condition window can extend to those board dates.</text>
<text x="1530" y="880" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="end" letter-spacing="0">Goods on Country, QBE Catalysing Impact Stage 2, 3 September 2026</text>
