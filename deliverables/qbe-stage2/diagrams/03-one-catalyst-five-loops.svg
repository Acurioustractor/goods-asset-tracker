<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <marker id="ah-t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#C45C3E"/></marker>
  <marker id="ah-i" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2A26"/></marker>
</defs>
<rect width="1600" height="900" fill="#FBF8F1"/>
<text x="70" y="62" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">THE MODEL. FIGURES FROM COMMUNITY-LOOP.TS</text>
<text x="70" y="108" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="38" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">One catalyst starts five loops a community controls</text>
<line x1="70" y1="126" x2="150" y2="126" stroke="#C45C3E" stroke-width="3"/>
<text x="70" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">The funder acts once. The board holds the rules. Each community decides what is given, what is sold, who is paid and what the sales money builds next.</text>
<text x="70" y="180" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">THE CATALYST, ONCE</text><rect x="70" y="190" width="400" height="112" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><text x="88" y="222" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">A funder backs the beds</text><text x="88" y="254.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">$750,000 is the cost of 1,000 beds at $750 each. Not</text><text x="88" y="272.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">sales, not community income.</text><line x1="478" y1="246" x2="590" y2="246" stroke="#C45C3E" stroke-width="2.5" marker-end="url(#ah-t)"/><rect x="600" y="190" width="400" height="112" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><text x="618" y="222" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">The Goods on Country board holds the</text><text x="618" y="242.4" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">rules</text><text x="618" y="274.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Purpose, shared assets, appointments, reinvestment.</text><text x="618" y="293" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Indigenous-led today; ownership stays a pathway.</text><line x1="1008" y1="246" x2="1120" y2="246" stroke="#C45C3E" stroke-width="2.5" marker-end="url(#ah-t)"/><rect x="1130" y="190" width="400" height="112" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><text x="1148" y="222" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Five community pools of 200 beds</text><text x="1148" y="254.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Each held by a community partner under rules agreed</text><text x="1148" y="272.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">before any bed moves.</text><path d="M1330,306 L1330,346 L1420,346" fill="none" stroke="#C45C3E" stroke-width="2.5"/><text x="1300" y="350" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="end" letter-spacing="0">× 5 into the loop</text><text x="70" y="362" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">ONE COMMUNITY LOOP, SHOWN ONCE, RUN FIVE TIMES</text><rect x="70" y="372" width="276" height="236" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="100" cy="406" r="16" fill="#C45C3E"/><text x="100" y="412" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">1</text><text x="126" y="412" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">200 beds arrive</text><text x="88" y="472" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Cost $150,000. Useful stock that</text><text x="88" y="490.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">lasts, held locally.</text><rect x="88" y="580" width="62.400000000000006" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="119.2" y="593" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">TARGET</text><line x1="348" y1="432" x2="364" y2="432" stroke="#C45C3E" stroke-width="2" marker-end="url(#ah-t)"/><rect x="366" y="372" width="276" height="236" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="396" cy="406" r="16" fill="#C45C3E"/><text x="396" y="412" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">2</text><text x="422" y="412" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">The community sets</text><text x="422" y="431.55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">the mix</text><text x="384" y="472" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Give some to meet immediate need.</text><text x="384" y="490.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Sell some to pay local work.</text><rect x="384" y="580" width="62.400000000000006" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="415.2" y="593" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">TARGET</text><line x1="644" y1="432" x2="660" y2="432" stroke="#C45C3E" stroke-width="2" marker-end="url(#ah-t)"/><rect x="662" y="372" width="276" height="236" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="692" cy="406" r="16" fill="#C45C3E"/><text x="692" y="412" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">3</text><text x="718" y="412" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Sales money stays</text><text x="718" y="431.55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">local</text><text x="680" y="472" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Up to $150,000 if all 200 sell at</text><text x="680" y="490.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">$750. Less when beds are given. A</text><text x="680" y="508.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">design number until the rules are</text><text x="680" y="526.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">agreed.</text><rect x="680" y="580" width="62.400000000000006" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="711.2" y="593" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">TARGET</text><line x1="940" y1="432" x2="956" y2="432" stroke="#C45C3E" stroke-width="2" marker-end="url(#ah-t)"/><rect x="958" y="372" width="276" height="236" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="988" cy="406" r="16" fill="#C45C3E"/><text x="988" y="412" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">4</text><text x="1014" y="412" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">The community decides</text><text x="1014" y="431.55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">what comes next</text><text x="976" y="472" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">More beds, a shredder or a press,</text><text x="976" y="490.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">the washer. A full facility is</text><text x="976" y="508.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">$150,000 to $220,000, so one pool</text><text x="976" y="526.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">sold in full reaches the bottom of</text><text x="976" y="544.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">that band and no further.</text><rect x="976" y="580" width="77.2" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="1014.6" y="593" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">MODELLED</text><line x1="1236" y1="432" x2="1252" y2="432" stroke="#C45C3E" stroke-width="2" marker-end="url(#ah-t)"/><rect x="1254" y="372" width="276" height="236" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="1284" cy="406" r="16" fill="#C45C3E"/><text x="1284" y="412" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">5</text><text x="1310" y="412" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Making moves closer</text><text x="1272" y="472" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">About $324 stays on a bed pressed</text><text x="1272" y="490.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">locally against about $65 on a kit.</text><text x="1272" y="508.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Modelled, not yet measured; the</text><text x="1272" y="526.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">measured run is what proves it.</text><rect x="1272" y="580" width="77.2" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="1310.6" y="593" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">MODELLED</text><path d="M1392,610 L1392,642 L504,642 L504,614" fill="none" stroke="#C45C3E" stroke-width="2.5" marker-end="url(#ah-t)"/><text x="948" y="662" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#C45C3E" font-weight="400" text-anchor="middle" letter-spacing="0" font-style="italic">Then the community decides again. The return arrow stays inside the community, never back to the funder.</text><text x="70" y="690" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">FOUR GATES BEFORE THE LOOP IS REAL AT A NAMED SITE</text><rect x="70" y="700" width="353" height="92" rx="6" fill="#EDE5D8" stroke="#EDE5D8" stroke-width="1.5"/><text x="88" y="732" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Buyers</text><text x="88" y="763.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Who is buying the sold beds, named.</text><rect x="439" y="700" width="353" height="92" rx="6" fill="#EDE5D8" stroke="#EDE5D8" stroke-width="1.5"/><text x="457" y="732" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Rules</text><text x="457" y="763.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Allocation, sales money, resale and stock,</text><text x="457" y="781.4000000000001" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">agreed and signed.</text><rect x="808" y="700" width="353" height="92" rx="6" fill="#EDE5D8" stroke="#EDE5D8" stroke-width="1.5"/><text x="826" y="732" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">An operator and a place</text><text x="826" y="763.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Who runs the line, where, and who pays them.</text><rect x="1177" y="700" width="353" height="92" rx="6" fill="#EDE5D8" stroke="#EDE5D8" stroke-width="1.5"/><text x="1195" y="732" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="16" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">A measured cost</text><text x="1195" y="763.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Fifty beds pressed at production rate, timed</text><text x="1195" y="781.4000000000001" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">and costed.</text>
<line x1="70" y1="838" x2="1530" y2="838" stroke="#CFC7B8" stroke-width="1"/>
<text x="70" y="862" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Working proposal. The rules for sales money, resale and who holds the beds are being agreed with each community. Until they are, the numbers are a design, not a promise. Gross sales are gross: only sold beds create</text><text x="70" y="879.55" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">them, and nothing has been deducted.</text>
<text x="1530" y="880" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="end" letter-spacing="0">Goods on Country, QBE Catalysing Impact Stage 2, 3 September 2026</text>
</svg>