<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <marker id="ah-t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#C45C3E"/></marker>
  <marker id="ah-i" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2A26"/></marker>
</defs>
<rect width="1600" height="900" fill="#FBF8F1"/>
<text x="70" y="62" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">FORM Q2, Q3, Q8. RECOMMENDED ROUTE, SUBJECT TO SOCIAL IMPACT HUB CONFIRMING ON 3 SEPTEMBER</text>
<text x="70" y="108" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="38" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">The entity, and how the money moves</text>
<line x1="70" y1="126" x2="150" y2="126" stroke="#C45C3E" stroke-width="3"/>
<text x="70" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Three entities in a dated line, one operating home, and five community partners who make the local decisions. Every external dollar lands in the charity.</text>
<text x="70" y="205" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">THE LINEAGE, DATED</text><rect x="70" y="220" width="400" height="150" rx="6" fill="#EDE5D8" stroke="#EDE5D8" stroke-width="1.5"/><text x="88" y="248" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">HISTORIC TRADING VEHICLE</text><text x="88" y="278" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Nicholas Marchesi, sole trader</text><text x="88" y="310.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">ABN 21 591 780 066. The FY26 books sit here. No Goods</text><text x="88" y="328.59999999999997" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">activity after the transfer.</text><line x1="478" y1="295" x2="590" y2="295" stroke="#C45C3E" stroke-width="2.5" marker-end="url(#ah-t)"/><text x="534" y="285" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="middle" letter-spacing="0">migrating, FY27</text><rect x="600" y="220" width="400" height="150" rx="6" fill="#EDE5D8" stroke="#EDE5D8" stroke-width="1.5"/><text x="618" y="248" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">RELATED ENTITY, COHORT ENTRANT</text><text x="618" y="278" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">A Curious Tractor Pty Ltd</text><text x="618" y="310.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">ABN 36 697 347 676. Entered the 2026 cohort; historic</text><text x="618" y="328.59999999999997" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">maker; transferring assets. Delivers nothing under</text><text x="618" y="346.79999999999995" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">the grant after transfer.</text><line x1="1008" y1="295" x2="1120" y2="295" stroke="#C45C3E" stroke-width="2.5" marker-end="url(#ah-t)"/><text x="1064" y="285" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="middle" letter-spacing="0">ruling X, 28 Aug</text><rect x="1130" y="220" width="400" height="150" rx="6" fill="#FFFFFF" stroke="#C45C3E" stroke-width="2.5"/><text x="1148" y="248" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">APPLICANT AND RECIPIENT</text><text x="1148" y="278" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">The Butterfly Movement Ltd, trading as</text><text x="1148" y="298.4" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Goods on Country</text><text x="1148" y="330.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">ABN 22 155 132 684. Company limited by guarantee.</text><text x="1148" y="349" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">ACNC charity since 2012, DGR since 17 Jan 2012.</text><text x="1148" y="367.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Business name from 23 Jul 2026.</text><text x="70" y="410" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">MONEY IN, ONE HOME, FIVE COMMUNITY PARTNERS</text><rect x="70" y="418" width="400" height="88" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><text x="88" y="450" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="15" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Catalytic grant</text><text x="88" y="480" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">QBE Catalysing Impact. $250,000 asked: one pool and the</text><text x="88" y="496.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">proof.</text><rect x="374.8" y="426" width="77.2" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="413.40000000000003" y="439" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">ASK MADE</text><line x1="478" y1="462" x2="596" y2="462" stroke="#C45C3E" stroke-width="2.5" marker-end="url(#ah-t)"/><rect x="70" y="516" width="400" height="88" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><text x="88" y="548" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="15" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Philanthropy</text><text x="88" y="578" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Tim Fairfax Family Foundation, Brian M. Davis, Snow,</text><text x="88" y="594.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Minderoo, Dusseldorp. Grants land in the charity.</text><rect x="300.79999999999995" y="524" width="151.20000000000002" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="376.4" y="537" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">INVITED / ASK MADE</text><line x1="478" y1="560" x2="596" y2="560" stroke="#C45C3E" stroke-width="2.5" marker-end="url(#ah-t)"/><rect x="70" y="614" width="400" height="88" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><text x="88" y="646" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="15" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Buyers</text><text x="88" y="676" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">ALIVE National Centre paid for 100 beds up front. Centrecorp</text><text x="88" y="692.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">has a 130-bed quote open.</text><rect x="345.2" y="622" width="106.80000000000001" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="398.6" y="635" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">PAID / QUOTE</text><line x1="478" y1="658" x2="596" y2="658" stroke="#C45C3E" stroke-width="2.5" marker-end="url(#ah-t)"/><rect x="70" y="712" width="400" height="88" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><text x="88" y="744" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="15" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Repayable finance</text><text x="88" y="774" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">SEFA and White Box, for equipment and working capital, after</text><text x="88" y="790.1" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="11.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">the measured run. Borrower to be settled.</text><rect x="389.6" y="720" width="62.400000000000006" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="420.8" y="733" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">TARGET</text><line x1="478" y1="756" x2="596" y2="756" stroke="#C45C3E" stroke-width="2.5" marker-end="url(#ah-t)"/><rect x="606" y="418" width="430" height="382" rx="6" fill="#FFFFFF" stroke="#C45C3E" stroke-width="2.5"/><text x="626" y="448" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">GOODS ON COUNTRY HOLDS THE WORK</text><text x="626" y="480" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="22" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">One operating home</text><text x="626" y="510" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">The board governs purpose, shared assets, appointments</text><text x="626" y="528.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">and reinvestment. Directors: Kristy Bloomfield, Audrey</text><text x="626" y="547.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Deemal, Jeremy Donovan. Indigenous-led. Ownership stays</text><text x="626" y="566.7" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">a pathway.</text><text x="626" y="595.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">It holds the products, IP, contracts, making, sales,</text><text x="626" y="614.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">delivery, capital, register and evidence.</text><text x="626" y="643.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">It buys the beds, agrees the rules with each community,</text><text x="626" y="662.3" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">runs the measured run, and reports.</text><text x="626" y="691.1999999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">It repays any equipment debt from its own margin on</text><text x="626" y="710.0999999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">buyer orders. Never from a community pool. No equity is</text><text x="626" y="728.9999999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">sold.</text><line x1="1044" y1="609" x2="1090" y2="609" stroke="#C45C3E" stroke-width="2.5" marker-end="url(#ah-t)"/><rect x="1100" y="418" width="430" height="382" rx="6" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="1120" y="448" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">FIVE COMMUNITY PARTNERS</text><text x="1120" y="480" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Independent organisations, not</text><text x="1120" y="504" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">subsidiaries</text><text x="1120" y="540" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Each holds a pool of 200 beds under rules agreed before</text><text x="1120" y="558.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">any bed moves: allocation, sales money, resale, paid</text><text x="1120" y="577.8" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">work and stock.</text><text x="1120" y="606.7" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Each decides what is given, what is sold, who is paid</text><text x="1120" y="625.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">and what comes next. Sales money stays local.</text><text x="1120" y="654.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">No community is named beside a pool until it has seen</text><text x="1120" y="673.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">the design. Nobody has been promised 200 beds.</text><rect x="1120" y="756" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#C45C3E" stroke-width="2"/><rect x="1160" y="756" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#C45C3E" stroke-width="2"/><rect x="1200" y="756" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#C45C3E" stroke-width="2"/><rect x="1240" y="756" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#C45C3E" stroke-width="2"/><rect x="1280" y="756" width="30" height="30" rx="6" fill="#FFFFFF" stroke="#C45C3E" stroke-width="2"/><text x="1326" y="777" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">× 200 beds each</text>
<line x1="70" y1="838" x2="1530" y2="838" stroke="#CFC7B8" stroke-width="1"/>
<text x="70" y="862" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">A Kind Tractor Ltd (ABN 73 669 029 341) is dormant and has no role. The REAL Innovation Fund grant (about $2M, DEWR) is Oonchiumpa's, related and disclosed, not a Goods line. Fallback if the cohort entrant must</text><text x="70" y="879.55" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">apply: A Curious Tractor applies, and the answer to Q8 rests on the inter-entity agreement, which is not yet signed.</text>
<text x="1530" y="880" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="end" letter-spacing="0">Goods on Country, QBE Catalysing Impact Stage 2, 3 September 2026</text>
</svg>