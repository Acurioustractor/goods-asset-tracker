  <marker id="ah-t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#C45C3E"/></marker>
  <marker id="ah-i" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2A26"/></marker>
</defs>
<rect width="1600" height="900" fill="#FBF8F1"/>
<text x="70" y="62" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">FORM Q5, Q6, Q7. FIGURES FROM BED-RATIO.TS. THE ASK BUYS BEDS; $400,000 IS 533</text>
<text x="70" y="108" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="38" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">One bed, four things, any amount</text>
<line x1="70" y1="126" x2="150" y2="126" stroke="#C45C3E" stroke-width="3"/>
<text x="70" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Every dollar buys beds. Every bed does four things. Any amount scales the same way, and every figure keeps its label.</text>
<rect x="70" y="200" width="560" height="560" rx="6" fill="#FFFFFF" stroke="#C45C3E" stroke-width="2.5"/><text x="94" y="234" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">THE UNIT</text><text x="94" y="292" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="44" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">One bed, $750</text><circle cx="110" cy="332" r="14" fill="#C45C3E"/><text x="110" y="337" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">1</text><text x="138" y="337" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="19" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">A bed off the ground</text><text x="138" y="362" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Washable, repairable, about five minutes to assemble.</text><rect x="138" y="378.9" width="77.2" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="176.6" y="391.9" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">VERIFIED</text><circle cx="110" cy="422.9" r="14" fill="#C45C3E"/><text x="110" y="427.9" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">2</text><text x="138" y="427.9" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="19" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">20kg of recycled plastic</text><text x="138" y="452.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Fifty beds is one tonne of HDPE kept in use. Weighed batch by</text><text x="138" y="471.79999999999995" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">batch in the measured run.</text><rect x="138" y="488.7" width="84.60000000000001" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="180.3" y="501.7" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">WORKPAPER</text><circle cx="110" cy="532.6999999999999" r="14" fill="#C45C3E"/><text x="110" y="537.6999999999999" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">3</text><text x="138" y="537.6999999999999" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="19" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">About 6.5 hours of local work</text><text x="138" y="562.6999999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Collect, shred, press, cut, assemble, deliver. Not yet timed;</text><text x="138" y="581.5999999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">3.5 of those hours are CNC and the stopwatch decides. About $130</text><text x="138" y="600.4999999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">of fair-wage labour a bed in the community cost state.</text><rect x="138" y="617.4" width="77.2" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="176.6" y="630.4" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">MODELLED</text><circle cx="110" cy="661.3999999999999" r="14" fill="#C45C3E"/><text x="110" y="666.3999999999999" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="14" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">4</text><text x="138" y="666.3999999999999" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="19" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Up to $750 that stays local</text><text x="138" y="691.3999999999999" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">If the community sells the bed. Given beds meet need instead.</text><text x="138" y="710.2999999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">The mix is the community's call, and none of it is income until</text><text x="138" y="729.1999999999998" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">the rules are agreed.</text><rect x="138" y="746.0999999999999" width="62.400000000000006" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="169.2" y="759.0999999999999" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">TARGET</text><text x="680" y="214" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">THE SAME RATIO AT ANY AMOUNT</text><text x="690" y="258" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="1">AMOUNT</text><text x="840" y="258" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="1">BEDS</text><text x="940" y="258" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="1">POOLS</text><text x="1040" y="258" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="1">PLASTIC</text><text x="1150" y="258" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="1">LOCAL WORK</text><text x="1300" y="258" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="1">STAYS LOCAL IF ALL SOLD</text><line x1="680" y1="270" x2="1530" y2="270" stroke="#2B2A26" stroke-width="1.5"/><text x="690" y="304" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">$150,000</text><text x="840" y="304" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">200</text><text x="940" y="304" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">1</text><text x="1040" y="304" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">4 t</text><text x="1150" y="304" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">1,300 h</text><text x="1300" y="304" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">up to $150,000</text><text x="690" y="328" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0.5">one community's pool</text><line x1="680" y1="344" x2="1530" y2="344" stroke="#CFC7B8" stroke-width="1"/><text x="690" y="378" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">$250,000</text><text x="840" y="378" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">333</text><text x="940" y="378" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">1.7</text><text x="1040" y="378" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">6.7 t</text><text x="1150" y="378" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">2,170 h</text><text x="1300" y="378" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">up to $250,000</text><text x="690" y="402" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0.5">the smaller amount, Q7</text><line x1="680" y1="418" x2="1530" y2="418" stroke="#CFC7B8" stroke-width="1"/><rect x="680" y="420" width="850" height="70" rx="4" fill="#EDE5D8" stroke="#C45C3E" stroke-width="2"/><text x="690" y="452" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">$400,000</text><text x="840" y="452" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">533</text><text x="940" y="452" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">2.7</text><text x="1040" y="452" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">10.7 t</text><text x="1150" y="452" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">3,470 h</text><text x="1300" y="452" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">up to $400,000</text><text x="690" y="476" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="0.5">the ask, Q5</text><line x1="680" y1="492" x2="1530" y2="492" stroke="#CFC7B8" stroke-width="1"/><text x="690" y="526" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">$750,000</text><text x="840" y="526" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">1,000</text><text x="940" y="526" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">5</text><text x="1040" y="526" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">20 t</text><text x="1150" y="526" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">6,500 h</text><text x="1300" y="526" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">up to $750,000</text><text x="690" y="550" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0.5">the whole program</text><line x1="680" y1="566" x2="1530" y2="566" stroke="#CFC7B8" stroke-width="1"/><rect x="680" y="596" width="850" height="164" rx="6" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="700" y="626" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">WHAT GOING FIRST DOES</text><text x="700" y="656" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">QBE's beds go in first, into the first two communities. Each sells what it decides to sell and keeps the</text><text x="700" y="677.025" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">money. The first fifty go through our own press and get costed, so the lenders have a measured number.</text><text x="700" y="698.05" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Every other funder's beds follow at the same ratio.</text>
<line x1="70" y1="838" x2="1530" y2="838" stroke="#CFC7B8" stroke-width="1"/>
<text x="70" y="862" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Working proposal. Beds at $750 each; plastic at 20kg a bed; local work at about 6.5 modelled hours a bed when made locally. Money that stays local is gross sales at $750 and only for beds the community chooses to</text><text x="70" y="879.55" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">sell. Ratios are per bed and scale in a straight line; real sites do not. The measured run replaces the modelled hours and the design plastic figure with measured ones.</text>
<text x="1530" y="880" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="end" letter-spacing="0">Goods on Country, QBE Catalysing Impact Stage 2, 3 September 2026</text>
</svg>