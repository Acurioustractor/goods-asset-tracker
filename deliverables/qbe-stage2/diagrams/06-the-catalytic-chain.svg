<text x="70" y="62" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">FORM Q14, Q18. LEVERAGE IS THE METRIC THE PROGRAM PUBLISHES: 3.7X IN 2025</text>
<text x="70" y="108" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="38" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">How the grant is catalytic: a chain with a release condition on every link</text>
<line x1="70" y1="126" x2="150" y2="126" stroke="#C45C3E" stroke-width="3"/>
<text x="70" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Stated as a chain, never as a total. QBE is never described as doubling, triggering or guaranteeing anything.</text>
<rect x="70" y="200" width="277.6" height="400" rx="6" fill="#FFFFFF" stroke="#C45C3E" stroke-width="2.5"/><circle cx="102" cy="236" r="18" fill="#C45C3E"/><text x="102" y="242" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">1</text><text x="132" y="242" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">QBE's beds go in</text><text x="132" y="261.55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">first</text><text x="90" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">333 beds into the first</text><text x="90" y="349.17" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">community. The first fifty go</text><text x="90" y="368.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">through our own press and get</text><text x="90" y="387.51" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">costed, so the cost of a locally</text><text x="90" y="406.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">made bed is measured.</text><rect x="90" y="570" width="143.8" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="161.9" y="583" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">THE ASK, $250,000</text><line x1="349.6" y1="236" x2="363.6" y2="236" stroke="#C45C3E" stroke-width="2" marker-end="url(#ah-t)"/><rect x="365.6" y="200" width="277.6" height="400" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="397.6" cy="236" r="18" fill="#C45C3E"/><text x="397.6" y="242" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">2</text><text x="427.6" y="242" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">That first pool</text><text x="427.6" y="261.55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">produces what a</text><text x="427.6" y="281.1" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">lender can read</text><text x="385.6" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">A community selling beds under</text><text x="385.6" y="349.17" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">agreed rules, a measured cost per</text><text x="385.6" y="368.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">bed, and buyer paper. The</text><text x="385.6" y="387.51" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">modelled $426 pressed-path cost</text><text x="385.6" y="406.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">becomes a measured one.</text><rect x="385.6" y="570" width="121.60000000000001" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="446.40000000000003" y="583" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">FOLLOWS LINK 1</text><line x1="645.2" y1="236" x2="659.2" y2="236" stroke="#C45C3E" stroke-width="2" marker-end="url(#ah-t)"/><rect x="661.2" y="200" width="277.6" height="400" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="693.2" cy="236" r="18" fill="#C45C3E"/><text x="693.2" y="242" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">3</text><text x="723.2" y="242" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Three invitations</text><text x="723.2" y="261.55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">already in hand</text><text x="681.2" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Tim Fairfax $300,000 for the</text><text x="681.2" y="349.17" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">block (due 9 Oct). Brian M. Davis</text><text x="681.2" y="368.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">$100,000 for pool three (due 25</text><text x="681.2" y="387.51" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Sep). Snow, ask made and a</text><text x="681.2" y="406.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">catch-up booked. Minderoo and</text><text x="681.2" y="425.85" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Dusseldorp in conversation.</text><rect x="681.2" y="570" width="129" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="745.7" y="583" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">$0 SIGNED TODAY</text><line x1="940.8000000000001" y1="236" x2="954.8000000000001" y2="236" stroke="#C45C3E" stroke-width="2" marker-end="url(#ah-t)"/><rect x="956.8000000000001" y="200" width="277.6" height="400" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="988.8000000000001" cy="236" r="18" fill="#C45C3E"/><text x="988.8000000000001" y="242" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">4</text><text x="1018.8000000000001" y="242" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">After the measured</text><text x="1018.8000000000001" y="261.55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">run, the equipment</text><text x="1018.8000000000001" y="281.1" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">finance</text><text x="976.8000000000001" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">SEFA $300,000 and White Box</text><text x="976.8000000000001" y="349.17" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">$150,000 for equipment and</text><text x="976.8000000000001" y="368.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">working capital. Neither can</text><text x="976.8000000000001" y="387.51" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">proceed while the cost is</text><text x="976.8000000000001" y="406.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">modelled and the borrower is</text><text x="976.8000000000001" y="425.85" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">unsettled.</text><rect x="976.8000000000001" y="570" width="129" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="1041.3000000000002" y="583" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">GATED ON LINK 2</text><line x1="1236.4" y1="236" x2="1250.4" y2="236" stroke="#C45C3E" stroke-width="2" marker-end="url(#ah-t)"/><rect x="1252.4" y="200" width="277.6" height="400" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="1284.4" cy="236" r="18" fill="#C45C3E"/><text x="1284.4" y="242" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">5</text><text x="1314.4" y="242" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Demand already</text><text x="1314.4" y="261.55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">paying</text><text x="1272.4" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">ALIVE National Centre bought 100</text><text x="1272.4" y="349.17" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">beds up front ($92,000, paid).</text><text x="1272.4" y="368.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Centrecorp holds a 130-bed quote,</text><text x="1272.4" y="387.51" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">deferred pending community</text><text x="1272.4" y="406.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">feedback. More than 200 requests</text><text x="1272.4" y="425.85" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">in each of Tennant Creek and</text><text x="1272.4" y="445.02" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Mparntwe.</text><rect x="1272.4" y="570" width="143.8" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="1344.3000000000002" y="583" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">VERIFIED PURCHASE</text><rect x="70" y="626" width="1460" height="130" rx="6" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="90" y="656" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">THE TEST OF CATALYTIC, AS CONTEXT.MD DEFINES IT: WHAT REMAINS AFTER THE FIRST SPEND</text><text x="90" y="686" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">After this money is spent, five communities hold beds, paid assembly and delivery work, sales money where they chose to sell, and the right to decide the next step. The lenders hold a</text><text x="90" y="706.59" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">measured cost, so the plants can be financed.</text>
<line x1="70" y1="838" x2="1530" y2="838" stroke="#CFC7B8" stroke-width="1"/>
<text x="70" y="862" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Statuses from raise-stack.ts on 2 September 2026: invited means a written invitation to apply for a named amount with a callable contact; ask made means an ask is with the funder and no written amount is back;</text><text x="70" y="879.55" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">target means our number and nothing from the funder yet; paid means money received and evidenced in Xero.</text>
