<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <marker id="ah-t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#C45C3E"/></marker>
  <marker id="ah-i" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2A26"/></marker>
</defs>
<rect width="1600" height="900" fill="#FBF8F1"/>
<text x="70" y="62" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">FORM Q14, Q18. LEVERAGE IS THE METRIC THE PROGRAM PUBLISHES: 3.7X IN 2025</text>
<text x="70" y="108" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="38" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">How the grant is catalytic: a chain with a release condition on every link</text>
<line x1="70" y1="126" x2="150" y2="126" stroke="#C45C3E" stroke-width="3"/>
<text x="70" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Stated as a chain, never as a total. QBE is never described as doubling, triggering or guaranteeing anything.</text>
<rect x="70" y="200" width="277.6" height="400" rx="6" fill="#FFFFFF" stroke="#C45C3E" stroke-width="2.5"/><circle cx="102" cy="236" r="18" fill="#C45C3E"/><text x="102" y="242" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">1</text><text x="132" y="242" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">QBE's beds go in</text><text x="132" y="261.55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">first</text><text x="90" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">533 beds into the first two</text><text x="90" y="349.17" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">communities. The first fifty go</text><text x="90" y="368.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">through our own press and get</text><text x="90" y="387.51" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">costed, so the cost of a locally</text><text x="90" y="406.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">made bed is measured.</text><rect x="90" y="570" width="143.8" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="161.9" y="583" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">THE ASK, $400,000</text><line x1="349.6" y1="236" x2="363.6" y2="236" stroke="#C45C3E" stroke-width="2" marker-end="url(#ah-t)"/><rect x="365.6" y="200" width="277.6" height="400" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="397.6" cy="236" r="18" fill="#C45C3E"/><text x="397.6" y="242" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">2</text><text x="427.6" y="242" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">The first pools give</text><text x="427.6" y="261.55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">the lenders</text><text x="427.6" y="281.1" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">something to read</text><text x="385.6" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Communities selling beds under</text><text x="385.6" y="349.17" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">signed rules, a cost per bed,</text><text x="385.6" y="368.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">buyer paper. The modelled $426</text><text x="385.6" y="387.51" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">pressed-path cost becomes a</text><text x="385.6" y="406.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">measured one.</text><rect x="385.6" y="570" width="121.60000000000001" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="446.40000000000003" y="583" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">FOLLOWS LINK 1</text><line x1="645.2" y1="236" x2="659.2" y2="236" stroke="#C45C3E" stroke-width="2" marker-end="url(#ah-t)"/><rect x="661.2" y="200" width="277.6" height="400" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="693.2" cy="236" r="18" fill="#C45C3E"/><text x="693.2" y="242" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">3</text><text x="723.2" y="242" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Three foundations</text><text x="723.2" y="261.55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">have already asked</text><text x="723.2" y="281.1" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">us to apply</text><text x="681.2" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Tim Fairfax $300,000 over three</text><text x="681.2" y="349.17" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">years (due 9 Oct). Brian M. Davis</text><text x="681.2" y="368.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">up to $100,000 (due 25 Sep).</text><text x="681.2" y="387.51" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Snow, catch-up booked. Minderoo</text><text x="681.2" y="406.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">and Dusseldorp in conversation.</text><rect x="681.2" y="570" width="129" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="745.7" y="583" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">$0 SIGNED TODAY</text><line x1="940.8000000000001" y1="236" x2="954.8000000000001" y2="236" stroke="#C45C3E" stroke-width="2" marker-end="url(#ah-t)"/><rect x="956.8000000000001" y="200" width="277.6" height="400" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="988.8000000000001" cy="236" r="18" fill="#C45C3E"/><text x="988.8000000000001" y="242" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">4</text><text x="1018.8000000000001" y="242" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Then the plant money</text><text x="976.8000000000001" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">SEFA $300,000 and White Box</text><text x="976.8000000000001" y="349.17" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">$150,000 for equipment and</text><text x="976.8000000000001" y="368.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">working capital, once the cost is</text><text x="976.8000000000001" y="387.51" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">measured and the borrower is</text><text x="976.8000000000001" y="406.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">settled.</text><rect x="976.8000000000001" y="570" width="106.80000000000001" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="1030.2" y="583" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">AFTER LINK 2</text><line x1="1236.4" y1="236" x2="1250.4" y2="236" stroke="#C45C3E" stroke-width="2" marker-end="url(#ah-t)"/><rect x="1252.4" y="200" width="277.6" height="400" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><circle cx="1284.4" cy="236" r="18" fill="#C45C3E"/><text x="1284.4" y="242" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="16" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">5</text><text x="1314.4" y="242" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Buyers are already</text><text x="1314.4" y="261.55" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="17" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">paying</text><text x="1272.4" y="330" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">ALIVE National Centre bought 100</text><text x="1272.4" y="349.17" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">beds up front ($92,000, paid).</text><text x="1272.4" y="368.34" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Centrecorp has 130 on quote,</text><text x="1272.4" y="387.51" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">waiting on community feedback.</text><text x="1272.4" y="406.68" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">More than 200 requests each in</text><text x="1272.4" y="425.85" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Tennant Creek and Mparntwe.</text><rect x="1272.4" y="570" width="143.8" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="1344.3000000000002" y="583" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">VERIFIED PURCHASE</text><rect x="70" y="626" width="1460" height="130" rx="6" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="90" y="656" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">THE TEST OF CATALYTIC, AS CONTEXT.MD DEFINES IT: WHAT REMAINS AFTER THE FIRST SPEND</text><text x="90" y="686" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">After this money is spent, five communities hold beds, paid assembly and delivery work, sales money where they chose to sell, and the right to decide the next step. The lenders hold a</text><text x="90" y="706.59" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">measured cost, so the plants can be financed.</text>
<line x1="70" y1="838" x2="1530" y2="838" stroke="#CFC7B8" stroke-width="1"/>
<text x="70" y="862" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Statuses from raise-stack.ts on 2 September 2026: invited means a written invitation to apply for a named amount with a callable contact; ask made means an ask is with the funder and no written amount is back;</text><text x="70" y="879.55" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">target means our number and nothing from the funder yet; paid means money received and evidenced in Xero.</text>
<text x="1530" y="880" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="end" letter-spacing="0">Goods on Country, QBE Catalysing Impact Stage 2, 3 September 2026</text>
</svg>