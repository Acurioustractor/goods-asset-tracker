<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <marker id="ah-t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#C45C3E"/></marker>
  <marker id="ah-i" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2A26"/></marker>
</defs>
<rect width="1600" height="900" fill="#FBF8F1"/>
<text x="70" y="62" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">FORM Q14, Q18. FIGURES FROM RAISE-STACK.TS, PULLED 2 SEPTEMBER 2026</text>
<text x="70" y="108" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="38" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Capital with three jobs</text>
<line x1="70" y1="126" x2="150" y2="126" stroke="#C45C3E" stroke-width="3"/>
<text x="70" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Philanthropy buys the beds and the block. Debt buys the machines and is repaid by buyers. Communities keep what their pools earn. Nobody is buying shares.</text>
<rect x="70" y="200" width="473.3333333333333" height="470" rx="6" fill="#FFFFFF" stroke="#C45C3E" stroke-width="2.5"/><text x="90" y="232" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">MONEY THAT BUYS BEDS</text><text x="90" y="264" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Gifts and purchases that buy beds into</text><text x="90" y="288" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">pools</text><text x="90" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">QBE Catalysing Impact, the ask</text><text x="523.3333333333333" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="end" letter-spacing="0">$400,000</text><rect x="90" y="328" width="77.2" height="18" rx="9" fill="#FBF8F1" stroke="#FBF8F1" stroke-width="1.5"/><text x="128.6" y="341" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">ASK MADE</text><line x1="90" y1="356" x2="523.3333333333333" y2="356" stroke="#CFC7B8" stroke-width="1"/><text x="90" y="370" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Brian M. Davis Charitable Foundation</text><text x="523.3333333333333" y="370" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="end" letter-spacing="0">$100,000</text><rect x="90" y="376" width="69.80000000000001" height="18" rx="9" fill="#EDE5D8" stroke="#EDE5D8" stroke-width="1.5"/><text x="124.9" y="389" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">INVITED</text><line x1="90" y1="404" x2="523.3333333333333" y2="404" stroke="#CFC7B8" stroke-width="1"/><text x="90" y="418" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Snow Foundation</text><text x="523.3333333333333" y="418" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="end" letter-spacing="0">$100,000</text><rect x="90" y="424" width="77.2" height="18" rx="9" fill="#FBF8F1" stroke="#FBF8F1" stroke-width="1.5"/><text x="128.6" y="437" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">ASK MADE</text><line x1="90" y1="452" x2="523.3333333333333" y2="452" stroke="#CFC7B8" stroke-width="1"/><text x="90" y="466" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Minderoo Foundation</text><text x="523.3333333333333" y="466" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="end" letter-spacing="0">$100,000</text><rect x="90" y="472" width="77.2" height="18" rx="9" fill="#FBF8F1" stroke="#FBF8F1" stroke-width="1.5"/><text x="128.6" y="485" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">ASK MADE</text><line x1="90" y1="500" x2="523.3333333333333" y2="500" stroke="#CFC7B8" stroke-width="1"/><text x="90" y="514" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Dusseldorp Forum</text><text x="523.3333333333333" y="514" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="end" letter-spacing="0">$50,000</text><rect x="90" y="520" width="62.400000000000006" height="18" rx="9" fill="#FBF8F1" stroke="#FBF8F1" stroke-width="1.5"/><text x="121.2" y="533" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">TARGET</text><line x1="90" y1="548" x2="523.3333333333333" y2="548" stroke="#CFC7B8" stroke-width="1"/><text x="90" y="562" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">ALIVE National Centre, 100 beds</text><text x="523.3333333333333" y="562" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="end" letter-spacing="0">$92,000</text><rect x="90" y="568" width="47.6" height="18" rx="9" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="113.8" y="581" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">PAID</text><line x1="90" y1="596" x2="523.3333333333333" y2="596" stroke="#CFC7B8" stroke-width="1"/><text x="90" y="624" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">If every line lands, the thousand is covered with room to spare</text><text x="90" y="641.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">(1,098). At $250K from QBE the count is 898 and the last pool</text><text x="90" y="659" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">waits.</text><rect x="563.3333333333333" y="200" width="473.3333333333333" height="470" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><text x="583.3333333333333" y="232" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">MONEY THAT RUNS THE ORGANISATION</text><text x="583.3333333333333" y="264" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Three years of support, the</text><text x="583.3333333333333" y="288" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">organisation's resilience</text><text x="583.3333333333333" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Tim Fairfax Family Foundation, three years</text><text x="1016.6666666666665" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="end" letter-spacing="0">$300,000</text><rect x="583.3333333333333" y="328" width="69.80000000000001" height="18" rx="9" fill="#EDE5D8" stroke="#EDE5D8" stroke-width="1.5"/><text x="618.2333333333332" y="341" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">INVITED</text><line x1="583.3333333333333" y1="356" x2="1016.6666666666665" y2="356" stroke="#CFC7B8" stroke-width="1"/><text x="583.3333333333333" y="384" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">About $109,500 a year runs Goods on Country before a bed is made;</text><text x="583.3333333333333" y="401.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">about $300,000 a year is the public network ask. Bed money never</text><text x="583.3333333333333" y="419" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">funds this. Katie Norman named the resilience of organisations as</text><text x="583.3333333333333" y="436.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">the reason for the invitation, so this is the block in the</text><text x="583.3333333333333" y="454" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">funder's own words. Proposed: the block rather than beds, which</text><text x="583.3333333333333" y="471.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">the TFFF invitation describes as the resilience of organisations.</text><text x="583.3333333333333" y="489" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Open until the founders rule.</text><rect x="1056.6666666666665" y="200" width="473.3333333333333" height="470" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><text x="1076.6666666666665" y="232" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">MONEY WE BORROW FOR THE PLANTS</text><text x="1076.6666666666665" y="264" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Equipment and working capital, once</text><text x="1076.6666666666665" y="288" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="20" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">the cost is measured</text><text x="1076.6666666666665" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">SEFA</text><text x="1509.9999999999998" y="322" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="end" letter-spacing="0">$300,000</text><rect x="1076.6666666666665" y="328" width="62.400000000000006" height="18" rx="9" fill="#FBF8F1" stroke="#FBF8F1" stroke-width="1.5"/><text x="1107.8666666666666" y="341" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">TARGET</text><line x1="1076.6666666666665" y1="356" x2="1509.9999999999998" y2="356" stroke="#CFC7B8" stroke-width="1"/><text x="1076.6666666666665" y="370" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">White Box SELF</text><text x="1509.9999999999998" y="370" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2A26" font-weight="600" text-anchor="end" letter-spacing="0">$150,000</text><rect x="1076.6666666666665" y="376" width="62.400000000000006" height="18" rx="9" fill="#FBF8F1" stroke="#FBF8F1" stroke-width="1.5"/><text x="1107.8666666666666" y="389" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="10" fill="#2B2A26" font-weight="400" text-anchor="middle" letter-spacing="1">TARGET</text><line x1="1076.6666666666665" y1="404" x2="1509.9999999999998" y2="404" stroke="#CFC7B8" stroke-width="1"/><text x="1076.6666666666665" y="432" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Cannot be written today: the pressed cost is modelled and the</text><text x="1076.6666666666665" y="449.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">borrower is unsettled. Repaid from Goods on Country's margin on</text><text x="1076.6666666666665" y="467" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">buyer orders, never from a community's pool. At the pressed margin</text><text x="1076.6666666666665" y="484.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">(about $324, modelled) $450,000 needs about 460 buyer-bought beds</text><text x="1076.6666666666665" y="502" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">a year for three years; at the kit margin (about $65) it cannot be</text><text x="1076.6666666666665" y="519.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">repaid.</text><rect x="70" y="694" width="1460" height="96" rx="6" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="90" y="724" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">THE MEASURED COST, AND IT COMES WITH THE FIRST POOL</text><text x="90" y="752" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">The first fifty beds go through our own press and get costed properly: plastic per bed, press time and power, CNC hours, operator hours, scrap. That gives a measured cost for a locally made bed,</text><text x="90" y="771.6" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">the number every lender has asked for and nobody has. The rules with each community are agreed before its beds move.</text>
<line x1="70" y1="838" x2="1530" y2="838" stroke="#CFC7B8" stroke-width="1"/>
<text x="70" y="862" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">$0 is signed today, and it is stated first. A Catalysing Impact grant is discretionary, typically $150,000 to $400,000 from a pool of up to $1.1 million across ten enterprises. It sits on top of signed external</text><text x="70" y="879.55" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">paper and does not double, trigger or guarantee anything. Two lines on Ben's note, FRRR Palm $20K and Luke EV Fleet $20K, have no second source and are not summed.</text>
<text x="1530" y="880" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="end" letter-spacing="0">Goods on Country, QBE Catalysing Impact Stage 2, 3 September 2026</text>
</svg>