<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
  <marker id="ah-t" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#C45C3E"/></marker>
  <marker id="ah-i" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#2B2A26"/></marker>
</defs>
<rect width="1600" height="900" fill="#FBF8F1"/>
<text x="70" y="62" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">FORM Q19, Q22. GOVERNANCE, FROM THE 26 AUGUST DECK BRIEF AND CONTEXT.MD</text>
<text x="70" y="108" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="38" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Who decides what</text>
<line x1="70" y1="126" x2="150" y2="126" stroke="#C45C3E" stroke-width="3"/>
<text x="70" y="152" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">One shared system. Local decisions stay local. Shown as three layers, never as three organisations in a row and never as a tree with communities beneath the charity.</text>
<rect x="70" y="200" width="1000" height="150" rx="6" fill="#FFFFFF" stroke="#C45C3E" stroke-width="2.5"/><text x="94" y="232" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">LAYER 1, GOVERNS</text><text x="94" y="270" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="26" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">An Indigenous-led board</text><text x="94" y="298" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Purpose, shared assets, appointments and reinvestment. Kristy Bloomfield and Audrey Deemal appointed as directors of The Butterfly</text><text x="94" y="316.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Movement Ltd (June and July 2026). The stated aim is full Indigenous directorship. The chair will be an Aboriginal director.</text><rect x="70" y="364" width="1000" height="150" rx="6" fill="#FFFFFF" stroke="#CFC7B8" stroke-width="1.5"/><text x="94" y="396" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">LAYER 2, HOLDS</text><text x="94" y="434" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="26" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Goods on Country</text><text x="94" y="462" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">The charity, the brand, the product system, the IP, fundraising, shared services, the register and the evidence. It agrees the rules</text><text x="94" y="480.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">with each community, buys the beds, runs the measured run, and reports once against one set of numbers.</text><rect x="70" y="528" width="1000" height="150" rx="6" fill="#DDE2D2" stroke="#DDE2D2" stroke-width="1.5"/><text x="94" y="560" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">LAYER 3, DECIDES</text><text x="94" y="598" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="26" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Each community partner</text><text x="94" y="626" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Allocation, local sales, local work, where the sales money goes, and whether and when to move toward production. Independent local</text><text x="94" y="644.9" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">decision-makers, not departments inside the charity.</text><rect x="1110" y="200" width="420" height="478" rx="6" fill="#EDE5D8" stroke="#EDE5D8" stroke-width="1.5"/><text x="1130" y="232" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">THE TEST THAT LETS THE OWNERSHIP CLAIM FAIL</text><text x="1130" y="266" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="22" fill="#2B2A26" font-weight="600" text-anchor="start" letter-spacing="0">Month six, four questions</text><text x="1130" y="316" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">1.  Who holds the keys to the site?</text><text x="1130" y="346" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">2.  Who runs the payroll for the local work?</text><text x="1130" y="376" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">3.  Who invoices the buyer?</text><text x="1130" y="406" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">4.  Is at least half of production done locally?</text><text x="1130" y="446" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Partial counts as no. Ownership stays a pathway wherever</text><text x="1130" y="464.2" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">it is not legally complete, and no surface says</text><text x="1130" y="482.4" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">otherwise.</text><line x1="1130" y1="506" x2="1510" y2="506" stroke="#CFC7B8"/><text x="1130" y="536" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="12" fill="#C45C3E" font-weight="400" text-anchor="start" letter-spacing="1.5">ALONGSIDE, ADVICE NOT AUTHORITY</text><text x="1130" y="562" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">An eleven-member advisory committee meets monthly: Kristy</text><text x="1130" y="579.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Bloomfield, Nicholas Marchesi OAM, Sally Grimsley-Ballard,</text><text x="1130" y="597" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">Daniel Pittman, Sam Davies, Judith Meiklejohn, Corey Tutt,</text><text x="1130" y="614.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">April Long, Susan Clear, Nina Fitzgerald, Shaun Fisher. It</text><text x="1130" y="632" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">gives challenge and openings. It holds no fiduciary</text><text x="1130" y="649.5" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#2B2A26" font-weight="400" text-anchor="start" letter-spacing="0">authority, and is never called a board.</text>
<line x1="70" y1="838" x2="1530" y2="838" stroke="#CFC7B8" stroke-width="1"/>
<text x="70" y="862" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Status language that holds on every surface: Indigenous-led today; two Indigenous directors appointed; the aim is full Indigenous directorship; ownership remains a pathway. No Supply Nation, IPP, IBA or First</text><text x="70" y="879.55" font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" fill="#6B6862" font-weight="400" text-anchor="start" letter-spacing="0">Australians Capital eligibility is inferred from board composition alone.</text>
<text x="1530" y="880" font-family="'Roboto Mono', Menlo, 'Courier New', monospace" font-size="11" fill="#6B6862" font-weight="400" text-anchor="end" letter-spacing="0">Goods on Country, QBE Catalysing Impact Stage 2, 3 September 2026</text>
</svg>