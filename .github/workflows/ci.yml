name: CI

# Quality gate for the Goods app (v2/). Before this, the only gate was Vercel's
# deploy build. This runs the drift guards (the alignment engine's enforcement)
# and the unit tests on every PR and push, plus a daily live asset-register
# drift check.

on:
  push:
    # 'claude/**' matters: every Claude Code session works on a claude/* branch,
    # so without it a session's pushes ran no checks at all until PR time.
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'claude/**', 'docs/**']
  pull_request:
  schedule:
    # Daily live asset-register drift check at 19:00 UTC.
    - cron: '0 19 * * *'
  workflow_dispatch:

defaults:
  run:
    working-directory: v2

jobs:
  checks:
    name: Drift guards + tests (hermetic)
    # Hermetic: no secrets, no external services. Runs on EVERY trigger,
    # including the daily schedule.
    #
    # This used to carry `if: github.event_name != 'schedule'`, on the reasoning
    # that hermetic checks cannot drift on their own between pushes. They can,
    # because the CONTENT they guard changes: an allowlist keyed to a sentence
    # dies when a prose sweep rewords that sentence. On 2026-08-21 check:drift:ci
    # had been failing on main and nobody knew, because the only recent runs on
    # main were the 19:00 cron — which skipped this job and reported green.
    #
    # A daily green tick that does not test the gate is worse than no tick: it
    # reads as assurance. Running it on the schedule costs ~2 minutes a day and
    # surfaces a red main the morning it happens rather than at the next push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Drift guards (canon, community-copy, qbe-guardrails)
        run: npm run check:drift:ci
      - name: Unit tests
        run: npm test

  asset-drift:
    name: Live asset-register drift (canon vs Supabase)
    # Needs Supabase secrets, so only where they are available and meaningful:
    # main pushes, the daily schedule, and manual runs. Re-derives the live
    # register and fails if CANONICAL_ASSETS has drifted.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: v2/package-lock.json
      - run: npm ci
      - name: Canon vs live register
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "::warning::Supabase secrets (SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY) not set in repo settings; skipping live asset-drift check."
            exit 0
          fi
          node scripts/check-asset-drift.mjs
