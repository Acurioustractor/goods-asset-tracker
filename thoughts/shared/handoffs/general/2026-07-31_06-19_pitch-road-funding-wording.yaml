questions:
  - Is the investor ending now short and emotionally legible enough after the long community road story?
  - Should the deck lead with the AU$400K commitment ask or the matched AU$800K program?
  - What exact repayable-capital language is acceptable before the measured production run establishes real cost and cycle time?
  - Working capital is still explicitly TO BE SIZED; do not invent a number.

decisions:
  - funding_story: Answer four questions only: how much is being raised, what it funds, what changes, and what each funding instrument returns.
  - raise_language: Seek AU$400K in eligible signed commitments; QBE can match up to AU$400K, creating an AU$800K program. Signed today remains AU$0.
  - return_language: Grants have public-good impact rather than financial return; repayable-capital terms cannot be promised before measurement; product orders buy beds and are revenue, not match capital.
  - evidence_status: Keep 338 beds per year and AU$426 per bed as modelled targets to test, never verified performance or promised return.
  - ownership: Describe one responsible community production pathway, never completed ownership or a finished handover.

findings:
  - user_need: The previous slides mixed operating thresholds, governance caveats, CRM pipeline, QBE mechanics and evidence links without answering the funding decision.
  - canonical_ask: ASK_BLOCKS currently covers equipment AU$112K–222K, a 50-bed measured run AU$60K–80K, working capital TO BE SIZED, fixed-block cover AU$110K–165K, and maintenance/site scoping AU$5K–8K per year plus.
  - locked_context: CONTEXT.md locks the short raise answer as AU$400K signed by 31 August with a dollar-for-dollar QBE match, but QBE remains the match vehicle rather than the external ask.
  - validation: Production build succeeds; existing Empathy Ledger upstream 404s fall back and remain unrelated warnings.
