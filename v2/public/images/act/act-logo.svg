<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none" stroke="currentColor" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="A Curious Tractor">
  <title>A Curious Tractor</title>

  <!-- Exhaust / light bar on top of cab -->
  <rect x="178" y="58" width="144" height="40" rx="11" />

  <!-- Cab / windshield -->
  <rect x="196" y="98" width="108" height="108" rx="4" />

  <!-- Main body / engine compartment -->
  <rect x="160" y="206" width="180" height="148" rx="14" />

  <!-- Headlights -->
  <circle cx="200" cy="246" r="16" />
  <circle cx="300" cy="246" r="16" />

  <!-- Grille bars -->
  <line x1="188" y1="296" x2="312" y2="296" />
  <line x1="188" y1="316" x2="312" y2="316" />
  <line x1="188" y1="336" x2="312" y2="336" />

  <!-- Left tire -->
  <rect x="60" y="188" width="88" height="168" rx="14" />
  <line x1="78"  y1="204" x2="78"  y2="340" />
  <line x1="96"  y1="204" x2="96"  y2="340" />
  <line x1="114" y1="204" x2="114" y2="340" />
  <line x1="132" y1="204" x2="132" y2="340" />

  <!-- Right tire -->
  <rect x="352" y="188" width="88" height="168" rx="14" />
  <line x1="370" y1="204" x2="370" y2="340" />
  <line x1="388" y1="204" x2="388" y2="340" />
  <line x1="406" y1="204" x2="406" y2="340" />
  <line x1="424" y1="204" x2="424" y2="340" />

  <!-- Wide bumper / undercarriage with tread teeth -->
  <rect x="40" y="358" width="420" height="48" rx="10" />
  <line x1="72"  y1="374" x2="72"  y2="390" />
  <line x1="100" y1="374" x2="100" y2="390" />
  <line x1="128" y1="374" x2="128" y2="390" />
  <line x1="156" y1="374" x2="156" y2="390" />
  <line x1="184" y1="374" x2="184" y2="390" />
  <line x1="212" y1="374" x2="212" y2="390" />
  <line x1="240" y1="374" x2="240" y2="390" />
  <line x1="268" y1="374" x2="268" y2="390" />
  <line x1="296" y1="374" x2="296" y2="390" />
  <line x1="324" y1="374" x2="324" y2="390" />
  <line x1="352" y1="374" x2="352" y2="390" />
  <line x1="380" y1="374" x2="380" y2="390" />
  <line x1="408" y1="374" x2="408" y2="390" />
  <line x1="436" y1="374" x2="436" y2="390" />

  <!-- Thin bottom bumper -->
  <rect x="40" y="414" width="420" height="36" rx="10" />
</svg>
